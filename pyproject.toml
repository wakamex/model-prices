[project]
name = "model-prices"
version = "0.0.6"
description = "Per-token LLM prices, current and historical, from models.dev with sourced corrections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "data/LICENSE.models.dev"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
model-prices = "model_prices:main"

[project.urls]
Homepage = "https://github.com/wakamex/model-prices"
Source = "https://github.com/wakamex/model-prices"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/data", "/tests", "/README.md", "/LICENSE"]
