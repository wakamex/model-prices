[project]
name = "llm-prices"
version = "0.1.0"
description = "Effective-dated LLM API prices from models.dev history, with sourced corrections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-prices = "llm_prices:main"

[project.urls]
Homepage = "https://github.com/wakamex/llm-prices"
Source = "https://github.com/wakamex/llm-prices"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
