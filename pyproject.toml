[project]
name = "llm-prices"
version = "0.1.0"
description = "Effective-dated LLM API prices from models.dev history, with sourced corrections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/llm_prices/data/LICENSE.models.dev"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-prices = "llm_prices:main"

[project.urls]
Homepage = "https://github.com/wakamex/llm-prices"
Source = "https://github.com/wakamex/llm-prices"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]
