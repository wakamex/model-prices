# Provider hints from harness and log names, mapped to models.dev provider ids.
[providers]
agy = "google"
claude = "anthropic"
codex = "openai"
dsh = "deepseek"
gemini = "google"
grok = "xai"
kimi = "moonshotai"
muse = "meta"
qwen = "alibaba"
zcode = "zai"

# Model names that do not resolve to a models.dev id by normalization, mapped to
# "provider/model". Effort suffixes such as -high and date suffixes are already stripped.
[models]
# Names the yuan pricing pages give models whose API ids differ, so the check compares them.
"doubao-seed-2-0-code" = "volcengine/doubao-seed-2-0-code-preview-260215"
"hy-role-latest" = "tencent-tokenhub/hunyuan-role-latest"
"grok-4-6" = "xai/grok-4.6"
"claude-haiku-3-5" = "anthropic/claude-3-5-haiku-latest"
"claude-opus-4" = "anthropic/claude-opus-4-0"
"claude-sonnet-4" = "anthropic/claude-sonnet-4-0"
# Releases before 0.0.4 do not search Cursor's models; this reaches them through the data.
"composer-2.5" = "cursor/composer-2.5"
# Mistral Medium 3.5's API name, which its docs list beside mistral-medium-2604.
"mistral-medium-3-5" = "mistral/mistral-medium-2604"
# DeepSeek V4.1 Flash, whose lab name in models.dev is dated as deepseek-v4.1-flash-1017;
# undated, the name would reach SenseNova's resale of it.
"deepseek-v4.1-flash" = "deepseek/deepseek-flash"
# SWE-2 Flash's family name, which Devin's CLI accepts as a model; Devin's models page prices
# all three of its effort variants the same.
"swe-2-flash" = "cognition/swe-2-flash-medium"
# Inkling's models.dev id; an earlier "inkling" file recorded its pre-discount list price.
"inkling" = "thinkingmachines/thinkingmachines/Inkling"
