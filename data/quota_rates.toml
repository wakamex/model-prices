method = "weekly"
note = "One account's quota history; a second account on the same plan measured $18.35, so this limit's value varies with how it is used."

[[rate]]
provider = "google"
plan = "ultra_100"
pool = "Antigravity, Gemini"
models = "Gemini 4 Argon and Gemini 4 Carbon"
match = '^Gemini 4 (Argon|Carbon)$'
usd_per_point = 1.9
measured = "2026-11-19"
method = "fitted"
note = "Fitted over 2026-11-01 to 2026-11-19 on $350 of Argon and Carbon usage, each call at its own time: Argon $1.92 per point (90% bootstrap interval $1.79 to $2.02) and Carbon $1.84 ($1.81 to $1.93). The fit explains 99.3% of the pool's 6-hour steps."

[[rate]]
provider = "google"
plan = "ultra_100"
pool = "Antigravity, Gemini"
models = "Gemini 4 Neon"
match = '^Gemini 4 Neon$'
usd_per_point = 6.0
measured = "2026-11-19"
method = "runs"
note = "Four runs of one fixed 3,000-word task on gemini-4-neon-high, each after the pool had been idle 15 minutes: $0.1946 for 0.03242 points, $0.2015 for 0.03358, $0.2072 for 0.03455, and $0.1929 for 0.03215, $6.00 a point each. A weekly point is four 5-hour points."

