# What a percentage point of a subscription's weekly quota is worth at API prices: the
# API-priced cost of the usage that moved the quota by one point. These are measurements of
# one user's accounts, not published by the labs: each entry gives the plan, the quota pool,
# the models that draw on it, the dollars per point, and the date and method of measurement.
#
# Measured from the quota percentages that clanker-analytics records every few minutes and the
# usage it prices with model-prices. `weekly` entries come from its quota history, which divides
# a fixed week's API-priced usage by the points it used; `fitted` entries split one pool between
# models by a non-negative least-squares fit of each 6-hour step in the pool's weekly quota on
# the API-priced usage of each model family in that step; `runs` entries run one fixed task on
# one model, on a pool no other project is using, and read the pool before and after each run.
# `match` names the benchmark models a rate prices.
#
# A plan dollar buys usd_per_month / 4.348 / 100 dollars' worth of weekly points, so a task
# that costs C at API prices costs C / usd_per_point * (usd_per_month / 434.8) of the plan, and
# a week at the limit holds 100 * usd_per_point / C such tasks.

[[rate]]
provider = "anthropic"
plan = "max_20x"
pool = "Weekly limit, all models"
models = "Claude models in Claude Code"
match = '^(Claude )?(Opus|Sonnet|Haiku) 5\.5$'
usd_per_point = 29.8
measured = "2026-11-19"
method = "Opus-only blocks"
note = "Measured on Opus 5.5, which is nearly all Claude Code usage: both Claude Ultra accounts' weekly readings summed over 3-hour blocks from 2026-10-14 to 2026-11-19 in which Opus was at least 97% of Claude Code's API spend gave $6,817 of Opus for 229 points, $29.77 a point, and a line fitted across those 76 blocks $29.88 (95% range $27.71 to $32.29) with no drift. A per-model fit with spend-cut units gives Opus $28.98 ($27.37 to $30.43). Sonnet 5.5 and Haiku 5.5 had too little usable spend, about $240 each, to show a rate different from Opus's, so they share it; in Antigravity's Claude and GPT pool, Opus and Sonnet measured the same per API dollar."

