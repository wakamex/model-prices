method = "weekly"
note = "One account's quota history; a second account on the same plan measured $18.35, so this limit's value varies with how it is used."

[[rate]]
provider = "google"
plan = "ultra_100"
pool = "Antigravity, Gemini"
models = "Gemini 4 Argon and Gemini 4 Carbon"
usd_per_point = 1.9
measured = "2026-11-19"
method = "fitted"
note = "Fitted over 2026-11-01 to 2026-11-19 on $350 of Argon and Carbon usage: Argon $1.96 and Carbon $1.83 per point, within the fit's noise. The fit explains 98.6% of the pool's 6-hour steps."

