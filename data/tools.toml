# Tool fees in USD per 1,000 billable calls that apply across a provider's models and that
# models.dev does not record. Each entry adds its tools to the models its `models` pattern
# matches, or to all the provider's models without one, from valid_from; it never replaces a
# fee models.dev or a correction gives. A tool name names one billing unit, as Rates.tools
# describes. model-prices check compares each price with the provider's page.

[[tool]]
provider = "openai"
# Reasoning models, "including gpt-5, o-series": GPT-5 and later except the chat models,
# and the o-series.
models = '^(o[1-9]|gpt-5(?!.*chat)|gpt-6)'
valid_from = "2025-06-24T00:00:00Z"
tools = { web_search_preview = 10.0 }
source = "https://developers.openai.com/api/docs/pricing#built-in-tools"
note = "OpenAI's tools table: \"Web search preview (reasoning models, including gpt-5, o-series) | $10.00 / 1k calls + Search content tokens billed at model rates.\" The API changelog of 2025-06-24 announced \"Reduced and simplified pricing for the web search tool\" (https://developers.openai.com/api/docs/changelog)."

[[tool]]
provider = "openai"
# Non-reasoning chat models.
models = '^(gpt-4o(?!.*(audio|realtime|transcribe|tts))|gpt-4\.1|gpt-5.*chat|chat-latest)'
valid_from = "2025-06-24T00:00:00Z"
tools = { web_search_preview = 25.0 }
source = "https://developers.openai.com/api/docs/pricing#built-in-tools"
note = "OpenAI's tools table: \"Web search preview (non-reasoning models) | $25.00 / 1k calls + Search content tokens are free.\" Dated by the API changelog of 2025-06-24, which announced \"Reduced and simplified pricing for the web search tool\" (https://developers.openai.com/api/docs/changelog)."

[[tool]]
provider = "perplexity"
models = '^sonar$'
valid_from = "2026-11-01T00:00:00Z"
tools = { web_search_fast = 1.0 }
source = "https://docs.perplexity.ai/docs/agent-api/tools/web-search"
note = "Perplexity's web search tool page: \"Fast calls cost $1.00 per 1,000 invocations instead of $2.50, plus model tokens.\" The page gives no start date, so it applies from its first reading, on 2026-11-01."
