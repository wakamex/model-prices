# Rates that override models.dev history for a period, because models.dev recorded a
# price change late or recorded a wrong price. valid_until is exclusive; each entry
# needs an authoritative source. When sources only bracket a change, the earlier
# documented price applies until the first observation of the new one. An open-ended correction names the models.dev values it
# replaces in `replaces`, and stops applying once models.dev records anything else, so
# a later fix or price change in models.dev ends it without an edit here.

[[correction]]
provider = "openai"
model = "gpt-5.6-sol"
valid_from = "2026-08-21T00:00:00Z"
valid_until = "2026-08-25T04:37:24Z"
input = 4.0
output = 20.0
cache_read = 0.4
cache_write = 5.0
tiers = [{ above = 272000, input = 8.0, output = 30.0, cache_read = 0.8, cache_write = 10.0 }]
source = "https://openai.com/index/gpt-5-6/"
note = "\"Update on August 21, 2026: OpenAI dropped the API and credit pricing of GPT-5.6 Sol by over 20% for the next 3 months.\" No time of day is given; models.dev updated on 2026-08-25. See research/price-dates/findings."

