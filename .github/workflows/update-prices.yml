name: Update prices

# Daily: record prices from official pages for models models.dev lacks, such as Cursor's,
# and rebuild price history from models.dev. A changed models.dev provider whose prices all
# match its official pricing page, or that has no official page to check against, goes
# straight to main; one that fails its check is held in the update-prices pull request, which a
# later run that holds nothing closes. Every run, and every push
# that changes the data, publishes the compiled snapshot to the data branch, where
# model_prices.refresh() fetches it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", "src/model_prices/snapshot.json"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prices
  cancel-in-progress: false

# Opening the pull request needs the repository setting that allows GitHub Actions to
# create pull requests.
jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every page the run fetches is recorded here for the page archive.
          echo "MODEL_PRICES_ARCHIVE=$RUNNER_TEMP/pages" >> "$GITHUB_ENV"

      - name: Apply price changes that match the official pages
        if: github.event_name != 'push'
        run: |
          git clone --quiet https://github.com/sst/models.dev.git "$RUNNER_TEMP/models.dev"
          # The prices the pricing pages stated, from the readings the runs so far recorded on
          # the data branch, go to data/pages.json, which the compiler reads when PAGES_FIRST is
          # on; this run's own readings reach it in the next run.
          # The copy the last build read, so the run that first publishes a page price can
          # report one models.dev prices differently.
          cp data/pages.json "$RUNNER_TEMP/pages-before.json"
          if git fetch --quiet origin data; then
            git worktree add --quiet --detach "$RUNNER_TEMP/readings" FETCH_HEAD
            uv --no-config run --locked model-prices readings pages "$RUNNER_TEMP/readings"
            git add data/pages.json
          fi
          # The page is the source for observed prices, so a change needs no other check.
          if ! uv --no-config run --locked model-prices observe; then
            echo "OBSERVE_FAILED=1" >> "$GITHUB_ENV"
          fi
          changed="$(uv --no-config run --locked model-prices update "$RUNNER_TEMP/models.dev" --json \
            | jq -r '.changed[]')"
          held=""
          for provider in $changed; do
            status=0
            uv --no-config run --locked model-prices check "$provider" || status=$?
            # Status 2 means the provider has no official check, so models.dev's prices publish
            # as they are.
            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
              held="$held $provider"
            fi
          done
          echo "HELD=$held" >> "$GITHUB_ENV"
          if [ -n "$held" ]; then
            git checkout -- data/prices.json src/model_prices/snapshot.json
            uv --no-config run --locked model-prices update "$RUNNER_TEMP/models.dev" --hold $held
          fi
          if ! git diff --quiet HEAD; then
            git commit -am "Update prices from models.dev and the pricing pages"
            git push origin main
          fi

      - name: Open or update the pull request for held providers
        if: github.event_name != 'push' && env.HELD != ''
        run: |
          open="$(gh pr list --head update-prices --state open --json number --jq '.[].number')"
          if [ -n "$open" ]; then
            # Keep corrections added to the pull request. The generated files are rebuilt
            # below, so take main's copies when the merge conflicts on them.
            git switch -C update-prices origin/update-prices
            git merge --no-edit origin/main || {
              git checkout origin/main -- data/prices.json src/model_prices/snapshot.json
              git commit --no-edit
            }
          else
            git switch -C update-prices
          fi
          uv --no-config run --locked model-prices update "$RUNNER_TEMP/models.dev"
          git add -A
          git diff --cached --quiet || git commit -m "Update prices from models.dev"
          if [ -n "$open" ]; then
            git push origin update-prices
          else
            # No open pull request, so the branch holds nothing worth keeping.
            git push --force origin update-prices
            gh pr create --fill --body "Rebuilt from models.dev. Held after failing their official check:${HELD}. Fix each failure with a correction, or with a models.dev pull request when models.dev is wrong. Check each changed model's valid_from against the provider's announcement and add a correction when models.dev recorded the change late."
          fi
          git switch main

      - name: Close the held providers' pull request once nothing is held
        if: github.event_name != 'push' && env.HELD == ''
        run: |
          open="$(gh pr list --head update-prices --state open --json number --jq '.[].number')"
          if [ -n "$open" ]; then
            # Its generated files are superseded by main's; a pull request that also changes
            # anything else, such as a correction, stays open for review.
            other="$(gh pr diff "$open" --name-only | grep -v -x -e data/prices.json -e src/model_prices/snapshot.json || true)"
            if [ -z "$other" ]; then
              gh pr close "$open" --comment "Every provider passed its official check, and main holds newer prices, so this is superseded."
            else
              echo "Pull request $open also changes $other, so it stays open."
            fi
          fi

      - name: Publish the snapshot to the data branch
        run: |
          # The schema 1 copy, without fields its readers do not know, serves releases up to
          # 0.0.5; later releases read the schema 2 snapshot the package bundles.
          uv --no-config run --locked model-prices compile --v1 "$RUNNER_TEMP/snapshot-v1.json"
          git diff --exit-code -- src/model_prices/snapshot.json
          # The tests fetch nothing real, so they must not record into the page archive.
          env -u MODEL_PRICES_ARCHIVE uv --no-config run --locked python -m unittest discover -s tests
          schema="$(uv --no-config run --locked python -c 'import model_prices; print(model_prices.SCHEMA)')"
          published="$RUNNER_TEMP/published"
          if git fetch --quiet origin data; then
            git worktree add "$published" FETCH_HEAD
            git -C "$published" switch -C data
          else
            git worktree add --orphan -b data "$published"
          fi
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for pair in "$schema:src/model_prices/snapshot.json" "1:$RUNNER_TEMP/snapshot-v1.json"; do
            version="${pair%%:*}" file="${pair#*:}"
            hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            mkdir -p "$published/v$version"
            cp "$file" "$published/v$version/$hash.json"
            jq -n --arg sha256 "$hash" --arg at "$at" \
              '{sha256: $sha256, published_at: $at}' > "$published/v$version/latest.json"
          done
          hash="$(sha256sum src/model_prices/snapshot.json | cut -d ' ' -f 1)"
          git -C "$published" add -A
          git -C "$published" commit -qm "Publish ${hash:0:12}"
          # The hourly page watch also pushes here, to other files, so a lost race rebases.
          git -C "$published" push origin data || {
            git -C "$published" pull --quiet --rebase origin data
            git -C "$published" push origin data
          }

      - name: Fail when a provider failed its official check
        if: github.event_name != 'push'
        run: |
          # A page price this run published first that models.dev prices differently fails
          # this run alone, after publishing it, for an agent to confirm or correct.
          conflicts=0
          uv --no-config run --locked model-prices readings conflicts "$RUNNER_TEMP/pages-before.json" || conflicts=1
          if [ -n "$HELD" ]; then
            echo "Held after failing the official check:$HELD"
            exit 1
          fi
          if [ -n "${OBSERVE_FAILED:-}" ]; then
            echo "Reading an official page for observed prices failed; see the step above."
            exit 1
          fi
          # Any other disagreement, such as a page that changed before models.dev did.
          uv --no-config run --locked model-prices check
          exit "$conflicts"

      # The website shows each model's check status from these results, so a deploy fetches no
      # pages itself. The pages this run fetched are read back from its archive, not fetched again.
      - name: Save the check results for the website
        if: always() && github.event_name != 'push'
        run: uv --no-config run --locked model-prices check --json > "$RUNNER_TEMP/check.json" || true
      - name: Upload the check results
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-results
          path: ${{ runner.temp }}/check.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Archive the fetched pages
        if: always()
        uses: ./.github/actions/archive-pages
        with:
          r2-endpoint: ${{ secrets.R2_ENDPOINT }}
          r2-access-key-id: ${{ secrets.R2_WRITE_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_WRITE_SECRET_ACCESS_KEY }}
      # After a parser fix, the readings it failed in earlier runs are read again from those
      # runs' pages, which the archive's bucket holds encrypted. Only this workflow, which runs
      # on main, gets the bucket's read token and the archive's key.
      - name: Read again the readings a parser failed in earlier runs
        if: always() && github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          ARCHIVE_AGE_KEY: ${{ secrets.ARCHIVE_AGE_KEY }}
        run: |
          log="$RUNNER_TEMP/fetch-log"
          [ -d "$log/readings" ] || exit 0
          retry="$RUNNER_TEMP/retry"
          key="$RUNNER_TEMP/archive-key.txt"
          (umask 077 && printf '%s\n' "$ARCHIVE_AGE_KEY" > "$key")
          for attempt in 1 2 3 4 5; do
            mkdir -p "$retry/blobs"
            cat "$log"/fetches/*.jsonl > "$retry/fetches.jsonl"
            # Eight downloads at a time, as a reader's version change can need hundreds of pages;
            # a page that cannot be downloaded leaves its reading as it is.
            uv --no-config run --locked model-prices readings retry-pages "$log" --archive "$retry" \
              | xargs -r -P 8 -I '{}' sh -c '[ -f "$0/blobs/$1" ] || { aws s3 cp --quiet --endpoint-url "$R2_ENDPOINT" "s3://model-prices-pages/blobs/$1.gz.age" - | age -d -i "$2" | gunzip > "$0/blobs/$1.part" && mv "$0/blobs/$1.part" "$0/blobs/$1" || rm -f "$0/blobs/$1.part"; }' "$retry" '{}' "$key"
            uv --no-config run --locked model-prices readings retry "$log" --archive "$retry"
            git -C "$log" add readings
            git -C "$log" diff --cached --quiet && break
            git -C "$log" commit -qm "Read again the readings a parser failed in earlier runs"
            git -C "$log" push --quiet origin HEAD:data && break
            # Another run pushed first: read again on its head.
            git -C "$log" fetch --quiet origin data
            git -C "$log" reset --quiet --hard FETCH_HEAD
            sleep $((attempt * 5))
          done
          rm -f "$key"
      # Where the prices read from the pages differ from those published, for information.
      - name: Compare the readings with the published prices
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/fetch-log/readings" ] || exit 0
          uv --no-config run --locked model-prices readings diff "$RUNNER_TEMP/fetch-log"
          # The snapshot a page-first build would publish, and where it differs from today's;
          # an impossible rate card in it fails the run.
          uv --no-config run --locked model-prices readings shadow "$RUNNER_TEMP/fetch-log"
