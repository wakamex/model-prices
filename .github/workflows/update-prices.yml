name: Update prices

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: git clone --quiet https://github.com/sst/models.dev.git "$RUNNER_TEMP/models.dev"
      - run: uv --no-config run --locked llm-prices update "$RUNNER_TEMP/models.dev"
      - name: Open or update the price pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C update-prices
          git commit -am "Update prices from models.dev"
          git push --force origin update-prices
          gh pr view update-prices >/dev/null 2>&1 || gh pr create --fill \
            --body "Rebuilt from models.dev. Check each changed model's valid_from against the provider's announcement and add a correction when models.dev recorded the change late."
      - name: Compare with official pricing pages
        run: uv --no-config run --locked llm-prices check
