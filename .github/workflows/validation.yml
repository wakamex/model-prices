name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Kept local rather than the shared python-validation.yml, whose unittest discovery
# would not run these pytest tests.
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv --no-config lock --check
      - run: uv --no-config run --locked pytest
      - run: uv --no-config build --no-sources
