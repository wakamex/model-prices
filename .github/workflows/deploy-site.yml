name: Deploy site

# Builds the website from the bundled price snapshot and the current official-page check,
# and publishes it as the model-prices Cloudflare Worker at model-prices.com: after each
# price update run, on site changes, and on request.

on:
  workflow_run:
    workflows: ["Update prices"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "tools/build_site.py", "wrangler.jsonc", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      # A price update commits to main, so the site is built from main's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install Zola
        run: |
          version=0.23.4
          archive=zola-v${version}-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/getzola/zola/releases/download/v${version}/${archive}"
          echo "54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de  $RUNNER_TEMP/$archive" \
            | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" zola
      - name: Build
        run: |
          # A failed check still builds the site; each model page shows its own status.
          uv --no-config run --locked model-prices check --json > "$RUNNER_TEMP/check.json" || true
          uv --no-config run --locked python tools/build_site.py --check-results "$RUNNER_TEMP/check.json"
          "$RUNNER_TEMP/zola" --root site build --output-dir site/public
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7c48ce23cb4423feb34a7fe3921e307f"
        run: npx wrangler@4.69.0 deploy
