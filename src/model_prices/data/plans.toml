# Subscription plan prices in USD per month, as billed monthly. provider is the lab;
# id is the plan name its usage tools report, or for a plan sold in several price tiers,
# that name with the tier's price, such as ultra_200. An entry without valid_from applies
# from before tracking began; valid_until is exclusive. A reported name that covers
# several tiers has no entry for that period, so it stays unpriced.

