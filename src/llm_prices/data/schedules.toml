# Time-of-day pricing. The recorded rate (models.dev history plus corrections) is the
# off-peak rate; inside a peak window every rate, including long-context tiers, is
# multiplied by peak_multiplier. Peak windows are UTC. A date listed under a holiday
# calendar is off-peak all day, judged by that calendar's local date.

[[schedule]]
provider = "deepseek"
valid_from = "2026-08-16T16:00:00Z"
valid_until = "2026-08-22T14:16:20Z"
peak_multiplier = 2.0
peak_hours_utc = [["01:00", "04:00"], ["06:00", "10:00"]]
weekdays_only = false
source = "https://api-docs.deepseek.com/news/news260813/"
note = "Pricing page archived 2026-08-16T17:14Z: peak hours every day. Still worded that way at 2026-08-22T14:16Z."

