# Time-of-day pricing, in one of two forms. With peak_hours_utc, the recorded rate
# (models.dev history plus corrections) is the off-peak rate, and inside a peak window every
# rate, including long-context tiers, is multiplied by peak_multiplier. With
# off_peak_hours_utc, the recorded rate is the standard rate, and inside an off-peak window
# each listed model's rates are multiplied by its off_peak_multiplier. Windows are UTC and
# may run past midnight. A date listed under a holiday calendar is off-peak all day, judged
# by that calendar's local date.

[[schedule]]
provider = "deepseek"
valid_from = "2025-02-26T16:30:00Z"
valid_until = "2025-09-05T16:00:00Z"
off_peak_hours_utc = [["16:30", "00:30"]]
off_peak_multiplier = { deepseek-chat = 0.5, deepseek-reasoner = 0.25 }
source = "https://x.com/deepseek_ai/status/1894710448676884671"
note = """
DeepSeek announced on 2025-02-26 at 11:25Z: "Starting today, enjoy off-peak discounts on
the DeepSeek API Platform from 16:30–00:30 UTC daily: DeepSeek-V3 at 50% off, DeepSeek-R1
at a massive 75% off." The archived pricing page of 2025-02-26T11:11Z lists the discount
(https://web.archive.org/web/20250226111135/https://api-docs.deepseek.com/quick_start/pricing).
It printed R1's discount prices as $0.035/$0.135/$0.550, within 2% of an exact 75% off, and
said the completion time of each request decides its price. The discount ended with the
V3.1 price list at 2025-09-05T16:00Z (https://www.deepseek.com/en/news/deepseek-v3-1/)."""

[[schedule]]
provider = "deepseek"
valid_from = "2026-08-16T16:00:00Z"
peak_multiplier = 2.0
peak_hours_utc = [["01:00", "04:00"], ["06:00", "10:00"]]
weekdays_only = true
holidays = "cn"
source = "https://api-docs.deepseek.com/zh-cn/updates"
note = """
Announced 2026-07-31, effective 2026-08-17 00:00 Beijing time, which is 2026-08-16T16:00Z.
The current rule is applied from that start. The pricing page first said peak hours applied
every day; "Monday through Friday" appeared between the 2026-08-22T13:06Z and
2026-08-23T18:11Z archives, and the holiday exclusion between 2026-09-17T23:31Z and
2026-09-19T10:10Z. No announcement introduced either change. See
docs/deepseek-pricing-history.md."""

# The pricing pages' current wording of these terms; llm-prices check compares each
# live page with it verbatim.
[schedule.terms]
en = "Off-peak rates are half of the peak rates. Peak hours are 01:00 - 04:00 and 06:00 - 10:00 UTC, Monday through Friday, excluding Chinese public holidays. All other hours are off-peak, including weekends and Chinese public holidays in full."
zh = "空闲时段价格为高峰时段价格的一半。北京时间周一至周五（不含中国法定节假日）9:00 - 12:00、14:00 - 18:00 为高峰时段；其余时段，包括周末及中国法定节假日全天均为空闲时段。"

# Mainland China public holidays (days off), local dates in UTC+8. Weekend make-up
# workdays are not listed: DeepSeek treats all weekends as off-peak.
[holidays.cn]
utc_offset_hours = 8
# The last date the list is known to cover. llm-prices check fails 45 days before it,
# so the next year's schedule is added before weekday holidays would price as peak.
covers_through = "2026-12-31"
source = "https://www.gov.cn/zhengce/content/202511/content_7047090.htm"
dates = [
  "2026-01-01", "2026-01-02", "2026-01-03",
  "2026-02-15", "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19",
  "2026-02-20", "2026-02-21", "2026-02-22", "2026-02-23",
  "2026-04-04", "2026-04-05", "2026-04-06",
  "2026-05-01", "2026-05-02", "2026-05-03", "2026-05-04", "2026-05-05",
  "2026-06-19", "2026-06-20", "2026-06-21",
  "2026-09-25", "2026-09-26", "2026-09-27",
  "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04", "2026-10-05",
  "2026-10-06", "2026-10-07",
]
