# Subscription plan prices in USD per month, as billed monthly. provider is the lab;
# id is the plan name its usage tools report. An entry without valid_from applies from
# before tracking began; a later entry for the same plan replaces it from its valid_from.
# Plans whose reported id covers several prices are left out, so they stay unpriced.

