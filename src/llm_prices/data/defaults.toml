# Model names that stand for "the product's default model", mapped to the model that
# default named on each date. A request under such a name is priced as the model in
# effect when it ran, and the resulting Rates carry inferred_from so reports can show
# that the model was inferred rather than recorded. check_url and check_pattern let
# llm-prices check compare the live default with the latest target.

[[alias]]
name = "gemini-default"
provider = "google"
description = "Antigravity's default Gemini model"
source = "https://github.com/google-antigravity/antigravity-sdk-python/commits/main/google/antigravity/models.py"
check_url = "https://raw.githubusercontent.com/google-antigravity/antigravity-sdk-python/main/google/antigravity/models.py"
check_pattern = '^DEFAULT_MODEL = "([^"]+)"'
note = """
Antigravity reports gemini-default for requests that ran on its default model, such as
Antigravity CLI runs before 1.1.10 (2026-08-03) whose --model flag was ignored. The
Antigravity SDK's DEFAULT_MODEL constant is the published record of that default; each
target starts at the commit that set it. The CLI could also fall back to a model the user
had saved, which this mapping cannot see."""
targets = [
  { valid_from = "2026-04-29T17:16:47Z", model = "gemini-3-flash-preview", commit = "2bae2be" },
  { valid_from = "2026-05-18T12:59:29Z", model = "gemini-3.5-flash", commit = "900c5b1" },
  { valid_from = "2026-07-21T17:27:11Z", model = "gemini-3.6-flash", commit = "cc6abbc" },
  { valid_from = "2026-08-10T23:27:43Z", model = "gemini-3.7-flash", commit = "9de85f1" },
  { valid_from = "2026-08-31T20:25:14Z", model = "gemini-3.8-flash", commit = "8673ee2" },
]
